[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "educagent-sdk"
version = "0.7.0"
description = "An agent-first SDK for evidence-driven teaching."
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "logfire[system-metrics]>=4.41,<5",
    "pydantic>=2.13,<3",
    "pydantic-ai-slim[openai]>=2.33,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
